plugins {
    id "java"
    id 'checkstyle'
    id 'application'
    id 'io.freefair.lombok' version '8.10'
}


group = 'com.epam.aidial'
version = "0.0.0"

apply plugin: 'java'
apply plugin: 'checkstyle'
apply plugin: 'application'
apply plugin: 'io.freefair.lombok'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = "10.26.1"
    configDirectory = file("$rootProject.projectDir/checkstyle")
    configProperties = [
            "org.checkstyle.google.suppressionfilter.config":
                    "$rootProject.projectDir/checkstyle/checkstyle-suppressions.xml",
    ]
}

configurations.checkstyle {
    // Security fix:
    resolutionStrategy.force 'org.apache.commons:commons-lang3:3.20.0' // CVE-2025-48924
    resolutionStrategy.force 'org.codehaus.plexus:plexus-utils:3.6.2' // CVE-2025-67030
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("io.netty:netty-bom:4.2.19.Final")
    implementation 'io.kubernetes:client-java:27.0.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.8'
    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.0.8'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.7'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test:4.0.8'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Security fix:
    implementation 'org.apache.commons:commons-lang3:3.20.0' // CVE-2025-48924
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.27' // CVE-2026-65182, CVE-2026-65905, CVE-2026-68525
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85' // CVE-2026-5598
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.4' // CVE-2026-89407, CVE-2026-89425
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4' // CVE-2026-68497, CVE-2026-91776, CVE-2026-91777
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.4' // CVE-2026-54428
    implementation 'tools.jackson.core:jackson-core:3.1.8' // CVE-2026-89407, CVE-2026-89425
    implementation 'tools.jackson.core:jackson-databind:3.1.8' // CVE-2026-68497, CVE-2026-91776, CVE-2026-91777
}

application {
    mainClass = 'com.epam.aidial.Application'
}

test {
    useJUnitPlatform()
}